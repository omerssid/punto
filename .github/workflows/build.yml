name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Distributed binaries must not be built with -march=native: the runner
  # may have instructions the machine downloading them does not, and the
  # result is a SIGILL on startup rather than a graceful failure.
  #
  # GCC 13 because std::format only reached libstdc++ there, and 22.04
  # ships GCC 11. Its runtime is linked statically: the glibc requirement
  # comes from the build host (2.35 here) but libstdc++ comes from the
  # compiler, so a dynamically linked GCC 13 binary would demand
  # GLIBCXX_3.4.31 and refuse to start on the very distribution it was
  # built on, which has 3.4.30.
  CMAKE_FLAGS: >-
    -DCMAKE_BUILD_TYPE=Release
    -DCMAKE_CXX_COMPILER=g++-13
    -DPUNTO_NATIVE_ARCH=OFF
    -DPUNTO_WERROR=ON
    -DPUNTO_STATIC_CXX_RUNTIME=ON
    -DPUNTO_DEV_SHADER_DIR=OFF
    -DCMAKE_INSTALL_PREFIX=/usr

jobs:
  build:
    name: build and test
    # Deliberately older than ubuntu-latest. A binary links against the
    # glibc it was built on and runs on that version or newer, so building
    # on 22.04 (glibc 2.35) covers 22.04 and 24.04, while building on 24.04
    # would not run on 22.04.
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 13
        # 22.04 ships GCC 11; <format> needs 13.
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-13
          g++-13 --version

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libglfw3-dev libglew-dev libgl1-mesa-dev \
            liblaszip-dev libxrandr-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja ${{ env.CMAKE_FLAGS }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Generate test fixtures
        # Writes the same helix in every encoding. The binary_compressed
        # variant needs PCL, which is not installed here -- the generator
        # skips it and the suite skips the matching comparison.
        run: python3 tests/make_fixtures.py

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test the binaries
        # No GPU or display on the runner, so this only reaches the code
        # paths before a GL context is needed. It still catches a broken
        # link or a missing runtime symbol, which is most of what goes
        # wrong between a green build and an unusable download.
        run: |
          ./build/punto-viewer --help > /dev/null
          ./build/punto-probe tests/fixtures/helix_binary.pcd > /dev/null
          ./build/punto-probe tests/fixtures/helix_12_fmt3.laz > /dev/null
          echo "binaries run"

      - name: Check the binaries are actually portable
        # The whole point of building on 22.04 with a static C++ runtime.
        # A GLIBCXX reference here means the static link silently failed
        # and the download would not start on the distribution it targets.
        run: |
          set -euo pipefail
          for binary in build/punto-viewer build/punto-probe; do
            # Without this the whole check passes vacuously when a binary
            # is missing, because grep finding nothing looks like success.
            test -f "$binary" || { echo "::error::$binary was not built"; exit 1; }

            glibcxx=$(objdump -T "$binary" | grep -oP 'GLIBCXX_[0-9.]+' | sort -V -u | tail -1 || true)
            if [ -n "$glibcxx" ]; then
              echo "::error::$binary needs $glibcxx at runtime; the static link failed"
              exit 1
            fi

            glibc=$(objdump -T "$binary" | grep -oP 'GLIBC_[0-9.]+' | sort -V -u | tail -1 || true)
            test -n "$glibc" || { echo "::error::no glibc symbols in $binary; objdump failed"; exit 1; }
            echo "$binary: no libstdc++ dependency, needs glibc <= $glibc"
          done

      - name: Package
        id: package
        run: |
          set -euo pipefail
          project_version="$(./build/punto-viewer --version | cut -d' ' -f2)"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # A tag that disagrees with project() would publish a .deb
            # whose version is not the one on the release page.
            if [[ "${GITHUB_REF_NAME}" != "v${project_version}" ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match project version ${project_version}"
              exit 1
            fi
            deb_version="${project_version}"
          else
            # '~' sorts before the release itself, so a snapshot of what
            # will become 0.2.0 upgrades cleanly to 0.2.0. The date keeps
            # snapshots in order, which a hash alone would not.
            # checkout is shallow, but HEAD's own date is always there.
            deb_version="${project_version}~git$(git log -1 --format=%cd --date=format:%Y%m%d).$(git rev-parse --short HEAD)"
          fi

          (cd build && cpack -D CPACK_DEBIAN_PACKAGE_VERSION="${deb_version}")
          deb="$(ls build/punto_*.deb)"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            # GitHub rewrites '~' in asset names, which would break the
            # install line in the notes. A fixed name also gives the
            # snapshot a stable download URL; dpkg reads the version from
            # the control file, never the filename.
            mv "${deb}" build/punto_latest_amd64.deb
            deb=build/punto_latest_amd64.deb
          fi
          sha256sum "${deb}" | sed 's|build/||' > "${deb}.sha256"
          dpkg-deb --info "${deb}"

          echo "deb=${deb}" >> "$GITHUB_OUTPUT"
          echo "version=${deb_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: |
            ${{ steps.package.outputs.deb }}
            ${{ steps.package.outputs.deb }}.sha256
            tests/fixtures/helix_12_fmt3.laz
          retention-days: 30

  install-test:
    name: install on ${{ matrix.image }}
    # The .deb's Depends line names packages as they exist on 22.04. Each
    # release below has to resolve all of them from its own archive, and
    # nothing short of a clean install proves that it does.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'debian:13']
    container: ${{ matrix.image }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb

      - name: Install
        run: |
          apt-get update
          apt-get install -y ./build/punto_*.deb

      - name: Check it runs
        run: |
          set -eu
          # A library apt could not supply would show up here, not in apt.
          if ldd /usr/bin/punto-viewer | grep "not found"; then exit 1; fi
          punto-viewer --version
          punto-probe tests/fixtures/helix_12_fmt3.laz > /dev/null
          test -f /usr/share/applications/punto.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/punto.svg
          test -f /usr/share/mime/packages/punto.xml

      - name: Remove
        run: |
          apt-get remove -y punto
          test ! -e /usr/bin/punto-viewer

  publish:
    name: publish
    # Only after every install test passes, so a release never carries a
    # package that is broken somewhere it claims to support.
    needs: [build, install-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb

      - name: Publish rolling build
        # Every push to the default branch replaces a single prerelease, so
        # there is always a current package to download without tagging.
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          deb="$(ls build/punto_*.deb)"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --title "Latest build (${{ needs.build.outputs.version }})" \
            --notes "Automatic build of \`${{ github.sha }}\`. For Ubuntu 22.04+ and Debian 12+, x86-64:

          \`\`\`
          sudo apt install ./$(basename "${deb}")
          \`\`\`" \
            --prerelease \
            --target "${{ github.sha }}" \
            "${deb}" "${deb}.sha256"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          deb="$(ls build/punto_*.deb)"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${deb}" "${deb}.sha256"

  build-minimal:
    name: build without optional dependencies
    # The LAZ and PRIME-detection paths are behind compile-time feature
    # checks. Building without them is the only way to know those branches
    # still compile, and that the viewer degrades rather than breaks.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 13
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-13

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libglfw3-dev libglew-dev libgl1-mesa-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja ${{ env.CMAKE_FLAGS }} 2>&1 | tee configure.log
          # Fail loudly if the runner turns out to have laszip after all,
          # because then this job is silently testing the same thing as the
          # other one.
          grep -q "laszip not found" configure.log

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        # The suite detects that this build has no laszip and asserts the
        # refusal path instead of the decode path.
        run: |
          python3 tests/make_fixtures.py
          ctest --test-dir build --output-on-failure

      - name: LAS still reads without laszip
        run: ./build/punto-probe tests/fixtures/helix_12_fmt3.las | grep -q "LAS 1.2"
